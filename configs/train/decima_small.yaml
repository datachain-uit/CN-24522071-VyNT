# MVP: huấn luyện Decima trên cấu hình tpch_small (10 executor, 50 job, tải ~0.85).
# Siêu tham số PPO giữ như upstream (config/decima_tpch.yaml) — chỉ sửa: khóa data_sampler_cls,
# device=cpu, số vòng lặp và số worker cho vừa laptop. Ghi lại mọi thay đổi khi báo cáo.
env_config: configs/env/tpch_small.yaml
env:
  mean_time_limit: 2.0e+7
trainer:
  trainer_cls: PPO
  device: cpu
  num_iterations: 500
  num_sequences: 2
  num_rollouts: 4                # 2 x 4 = 8 tiến trình rollout song song (giảm nếu máy ít nhân CPU)
  seed: 0
  artifacts_dir: results/train/decima_small/seed0
  checkpointing_freq: 25
  use_tensorboard: true
  num_epochs: 3
  num_batches: 10
  clip_range: 0.2
  target_kl: 0.01
  entropy_coeff: 0.04
  beta_discount: 5.0e-3
  opt_cls: Adam
  opt_kwargs: {lr: 3.0e-4}
  max_grad_norm: 0.5
agent:
  agent_cls: DecimaScheduler
  embed_dim: 16
  gnn_mlp_kwargs: {hid_dims: [32, 16], act_cls: LeakyReLU, act_kwargs: {inplace: true, negative_slope: 0.2}}
  policy_mlp_kwargs: {hid_dims: [64, 64], act_cls: Tanh}
