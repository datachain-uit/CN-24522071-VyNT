# Quy mô giống cấu hình huấn luyện mẫu của Decima/spark-sched-sim: 50 executor, 200 job,
# khoảng cách đến trung bình 25 s (README của decima-sim ghi "load ~85%"; ước lượng thô từ
# results/eda cho ~0.71 — hãy đối chiếu với executor_utilization đo được). Dùng ở giai đoạn sau MVP.
name: tpch_medium
num_executors: 50
job_arrival_cap: 200
job_arrival_rate: 4.0e-5
moving_delay: 2000.0
warmup_delay: 1000.0
data_sampler_cls: TPCHDataSampler
